<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XUNITZ — ruwe schets opening</title>
<meta name="robots" content="noindex">
<style>
@font-face{font-family:"XU";src:url("css/fonts/InstrumentSans-Bold.woff2") format("woff2");font-weight:700}
:root{--paper:#f4f2ec;--paper2:#e9e6dc;--ink:#0b0b0b;--mute:#7b7871;--pad:clamp(16px,3vw,48px);--cols:7;--q:calc((100vw - 2 * var(--pad)) / var(--cols));--g:calc(var(--q) * .04)}
*{box-sizing:border-box;margin:0}
body{background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(to right,rgba(11,11,11,.07) 1px,transparent 1px),linear-gradient(to bottom,rgba(11,11,11,.07) 1px,transparent 1px);
  background-size:var(--q) var(--q);background-position:var(--pad) 0}
a{color:inherit;text-decoration:none}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;line-height:1.5}
.kop{font-family:XU,Arial,sans-serif;font-weight:700;font-feature-settings:"ss05" 1,"ss06" 1,"ss07" 1,"ss08" 1;text-transform:uppercase;letter-spacing:-.06em;line-height:.9;white-space:nowrap;font-size:calc(var(--q) * .42)}
.kop span{display:block}
.r{display:grid;grid-template-columns:repeat(var(--cols),var(--q));grid-auto-rows:var(--q);padding:0 var(--pad)}
.p{margin:calc(var(--g) / 2);padding:calc(var(--q) * .14);position:relative;min-width:0}

/* vaste balk: verschijnt als de menuvakken uit beeld zijn */
.balk{position:fixed;top:0;left:0;right:0;height:52px;display:flex;justify-content:space-between;align-items:center;padding:0 var(--pad);background:var(--paper);border-bottom:1px solid rgba(11,11,11,.12);z-index:10;transform:translateY(-100%);transition:transform .35s ease}
.balk.aan{transform:none}
.balk img{height:16px}
.balk nav{display:flex;gap:28px}

/* rij 1 */
.logo{grid-column:1 / 5;grid-row:1;background:#fff;display:flex;align-items:center}
.logo img{height:calc(var(--q) * .3);max-width:100%}
.menu{grid-row:1;background:#fff;display:flex;flex-direction:column;justify-content:space-between;transition:background .2s}
.menu .n{color:var(--mute)}
.m1{grid-column:5}.m2{grid-column:6}.m3{grid-column:7}
.menu b{font-family:XU,Arial,sans-serif;font-size:calc(var(--q) * .115);letter-spacing:-.03em;text-transform:uppercase}
.menu:hover{background:var(--ink);color:var(--paper)}

/* rij 2–4 */
.t1{grid-column:1 / 5;grid-row:2 / 5;background:var(--paper2);display:flex;flex-direction:column;justify-content:space-between}
.gevels{grid-column:5 / 8;grid-row:2 / 5;margin:calc(var(--g) / 2);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:var(--g)}
.gevels figure{position:relative;overflow:hidden}
.gevels img{width:100%;height:100%;object-fit:cover;display:block}
.gevels figcaption{position:absolute;left:0;top:0;background:var(--paper);padding:5px 8px 4px}
.strip{grid-column:5 / 8;grid-row:5;align-self:start;display:flex;justify-content:space-between;margin:calc(var(--g)) calc(var(--g) / 2) 0;border-bottom:1px solid rgba(11,11,11,.18);padding-bottom:6px}

/* rij 5–7: blijft staan tijdens 3 scrollstappen */
.scroll{height:calc(var(--q) * 3 + 200vh);margin-top:calc(var(--q) * .5)}
.plak{position:sticky;top:calc(50vh - var(--q) * 1.5)}
.t2{grid-column:1 / 5;grid-row:1 / 4;background:#fff;display:flex;flex-direction:column;justify-content:space-between}
.t2 .kop span{opacity:0;transform:translateY(.25em);transition:opacity .5s,transform .5s}
.t2 .kop span.aan{opacity:1;transform:none}
.plan{grid-column:5 / 8;grid-row:1 / 4;background:#fff}
.plan img{position:absolute;inset:4%;width:92%;height:92%;object-fit:contain;opacity:0;transition:opacity .6s}
.plan img.aan{opacity:1}
.plan .lab{position:absolute;left:calc(var(--q) * .14);top:calc(var(--q) * .14)}
.volgende{display:block;padding:calc(var(--q) * .5) var(--pad) 40vh;color:var(--mute)}

/* smal scherm: 4 kolommen, vlakken onder elkaar */
@media (max-width:899px){
  :root{--cols:4}
  .logo{grid-column:1 / 5;grid-row:1}
  .menu{grid-row:2}.m1{grid-column:1}.m2{grid-column:2}.m3{grid-column:3}
  .menu b{font-size:calc(var(--q) * .15)}
  .balk nav{gap:14px;font-size:9px;white-space:nowrap}.balk img{height:12px}
  .t1{grid-column:1 / 5;grid-row:3 / 6}
  .gevels{grid-column:1 / 5;grid-row:6 / 10}
  .strip{grid-column:1 / 5;grid-row:10}
  .kop{font-size:calc(var(--q) * .36)}
  .scroll{height:calc(var(--q) * 7 + 200vh);margin-top:0}
  .plak{top:60px}
  .t2{grid-column:1 / 5;grid-row:1 / 4}
  .plan{grid-column:1 / 5;grid-row:4 / 8}
  .plak{top:calc(100vh - var(--q) * 7 - 10px)}
}
@media (prefers-reduced-motion:reduce){.t2 .kop span,.plan img{opacity:1;transform:none;transition:none}}
</style>
</head>
<body>

<header class="balk" aria-hidden="true">
  <img src="img/logo.svg" alt="XUNITZ">
  <nav class="mono"><a href="index.html#systeem">02 Systeem</a><a href="index.html#indelingen">05 Indelingen</a><a href="index.html#contact">07 Contact</a></nav>
</header>

<main>
<div class="r" style="padding-top:calc(var(--q) * .25)">
  <div class="p logo"><img src="img/logo.svg" alt="XUNITZ"></div>
  <a class="p menu m1" href="index.html#systeem"><span class="n mono">02</span><b>Systeem</b></a>
  <a class="p menu m2" href="index.html#indelingen"><span class="n mono">05</span><b>Indelingen</b></a>
  <a class="p menu m3" href="index.html#contact"><span class="n mono">07</span><b>Contact</b></a>

  <section class="p t1">
    <p class="mono">Compact modulair wonen</p>
    <h1 class="kop"><span>Bouw minder.</span><span>Maak meer</span><span>mogelijk.</span></h1>
  </section>
  <div class="gevels">
    <figure><img src="img/noord.jpg" alt="Noordgevel"><figcaption class="mono">N-01 Noord</figcaption></figure>
    <figure><img src="img/oost.jpg" alt="Oostgevel"><figcaption class="mono">O-02 Oost</figcaption></figure>
    <figure><img src="img/west.jpg" alt="Westgevel"><figcaption class="mono">W-04 West</figcaption></figure>
    <figure><img src="img/zuid.jpg" alt="Zuidgevel"><figcaption class="mono">Z-03 Zuid</figcaption></figure>
  </div>
  <div class="strip mono"><span>001 / Referentiewoning</span><span>[ Gebouwd ]</span></div>
</div>

<div class="scroll" id="stappen">
  <div class="plak r">
    <section class="p t2">
      <p class="mono">Eén systeem · Verschillende woningen</p>
      <h2 class="kop"><span>Ontworpen.</span><span>Gebouwd.</span><span>Bewoond.</span></h2>
    </section>
    <div class="p plan">
      <p class="lab mono">Plattegrond · 5 modules</p>
      <img src="img/schets/plat-1-lijn.png" alt="">
      <img src="img/schets/plat-2-muren.png" alt="">
      <img src="img/schets/plat-3-inrichting.png" alt="Plattegrond van de referentiewoning">
    </div>
  </div>
</div>
<a class="volgende mono" href="index.html#systeem">02 Systeem ↓</a>
</main>

<script>
// vaste balk zodra de menuvakken uit beeld zijn
const balk=document.querySelector('.balk'),menu=document.querySelector('.menu');
new IntersectionObserver(([e])=>balk.classList.toggle('aan',!e.isIntersecting&&e.boundingClientRect.top<0)).observe(menu);
// drie scrollstappen: regel 1 + lijntekening, regel 2 + muren, regel 3 + inrichting
const blok=document.getElementById('stappen'),regels=[...document.querySelectorAll('.t2 .kop span')],lagen=[...document.querySelectorAll('.plan img')];
function stap(){
  const r=blok.getBoundingClientRect(),lengte=blok.offsetHeight-innerHeight;
  const p=Math.min(1,Math.max(0,-r.top/Math.max(1,lengte)));
  const n=r.top<innerHeight*.6?(p<.25?1:p<.55?2:3):0;
  regels.forEach((s,i)=>s.classList.toggle('aan',i<n));
  lagen.forEach((l,i)=>l.classList.toggle('aan',i<n));
}
addEventListener('scroll',stap,{passive:true});addEventListener('resize',stap);stap();
</script>
</body>
</html>
